<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#14141d"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)" stroke="#27272A" stroke-width="2.5"/>

  <!-- Concentric Touch Pinch Inward Rings -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.3"/>
  <circle cx="64" cy="64" r="28" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 4" opacity="0.5"/>
  <circle cx="64" cy="64" r="14" fill="#1E293B" stroke="url(#blueGlow)" stroke-width="2"/>

  <!-- 4 Touch Finger Dots (Pinch) -->
  <circle cx="40" cy="40" r="7" fill="url(#blueGlow)"/>
  <circle cx="88" cy="40" r="7" fill="url(#blueGlow)"/>
  <circle cx="40" cy="88" r="7" fill="url(#blueGlow)"/>
  <circle cx="88" cy="88" r="7" fill="url(#blueGlow)"/>

  <!-- Stylus Stylized Line Overlay -->
  <path d="M 94 22 L 106 34 L 56 84 L 44 84 L 44 72 Z" fill="url(#purpleGlow)" opacity="0.9"/>
  <polygon points="44,84 38,90 40,80" fill="#E4E4E7"/>
</svg>
